include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t11
  
build:
  extends: .build

deploy-dev:
  extends: .deploy-k8s-dev
  variables:
    components: "dev_t11"

deploy-staging:
  extends: .deploy-k8s-staging
  variables:
    components: "staging_t11"

deploy-prod:
  extends: .deploy-prod
  variables:
    components: "prod_t11"